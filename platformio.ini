; PlatformIO alternative to the Arduino IDE (NOT build-tested in this repository - the Arduino IDE / arduino-cli path is).
; Layout:  platformio.ini  +  DeskCompanion/DeskCompanion.ino   (User_Setup.h is NOT needed - the flags below replace it)
; To build the bring-up sketch instead, change src_dir to CoreBringup and drop the TFT_eSPI flags / libraries.

[platformio]
src_dir = DeskCompanion

[env:esp32-s3-zero]
; pioarduino = Arduino-ESP32 core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.filesystem = littlefs
lib_deps =
    bodmer/TFT_eSPI
    bitbank2/AnimatedGIF
    thomasfredericks/Bounce2
    bblanchon/ArduinoJson @ ^7
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDC_RGB_PIN=21
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=8
    -DTFT_DC=9
    -DTFT_RST=10
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSPI_FREQUENCY=40000000
